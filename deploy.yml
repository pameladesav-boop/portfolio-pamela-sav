name: Publicar portfólio

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Ler configuração do GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Instalar dependências
        run: npm ci
      - name: Verificar projeto
        run: npm run check
      - name: Gerar site
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Preparar arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
